# Workflow do GitHub Actions pro BinSecScan
#
# Escolhi rodar em tres sistemas diferentes (Linux, Windows e macOS)
# pra garantir que o codigo compila em todas as plataformas.
# No Windows, instalo o gcc via MinGW porque o cl (MSVC) nao vem
# configurado por padrao no runner do GitHub.

name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile
        run: make

      - name: Test basic functionality
        run: |
          ./binsecscan -t 4.5 /bin/ls || echo "Teste com /bin/ls executado"
          ./binsecscan -t 4.5 ./binsecscan || echo "Teste com ele mesmo executado"
          ./binsecscan || echo "Teste de ajuda executado"

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc (MinGW)
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Verify gcc installation
        run: gcc --version
        shell: cmd

      - name: Compile with gcc
        run: make CC=gcc
        shell: cmd

      - name: Test basic functionality
        run: |
          .\binsecscan.exe -t 4.5 C:\Windows\System32\notepad.exe || echo "Teste executado"
          .\binsecscan.exe || echo "Teste de ajuda executado"
        shell: cmd

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make

      - name: Compile
        run: make

      - name: Test basic functionality
        run: |
          ./binsecscan -t 4.5 /bin/ls || echo "Teste com /bin/ls executado"
          ./binsecscan -t 4.5 ./binsecscan || echo "Teste com ele mesmo executado"
          ./binsecscan || echo "Teste de ajuda executado"