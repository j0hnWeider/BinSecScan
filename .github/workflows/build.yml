# Workflow do GitHub Actions pro BinSecScan
#
# Escolhi rodar em tres sistemas diferentes (Linux, Windows e macOS)
# pra garantir que o codigo compila em todas as plataformas.
# No Windows, usei o MSYS2 (via setup-msys2) porque é mais rapido
# que instalar o MinGW via Chocolatey. O MSYS2 já vem com o gcc
# e é mantido pela propria comunidade do GitHub Actions.

name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile
        run: make

      - name: Test basic functionality
        run: |
          ./binsecscan -t 4.5 /bin/ls || echo "Teste com /bin/ls executado"
          ./binsecscan -t 4.5 ./binsecscan || echo "Teste com ele mesmo executado"
          ./binsecscan || echo "Teste de ajuda executado"

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: gcc make

      - name: Compile with MSYS2
        shell: msys2 {0}
        run: |
          make

      - name: Test basic functionality
        shell: msys2 {0}
        run: |
          ./binsecscan.exe -t 4.5 C:/Windows/System32/notepad.exe || echo "Teste executado"
          ./binsecscan.exe || echo "Teste de ajuda executado"

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make

      - name: Compile
        run: make

      - name: Test basic functionality
        run: |
          ./binsecscan -t 4.5 /bin/ls || echo "Teste com /bin/ls executado"
          ./binsecscan -t 4.5 ./binsecscan || echo "Teste com ele mesmo executado"
          ./binsecscan || echo "Teste de ajuda executado"